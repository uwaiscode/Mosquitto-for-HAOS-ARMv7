# =============================================================
# Mosquitto MQTT Broker - Configuration for Home Assistant OS
# =============================================================

# Persistence: store messages & subscriptions across restarts
persistence true
persistence_location /data/mosquitto/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Disable anonymous access
allow_anonymous false

# ------------------------------------------
# Listener 1: MQTT on port 1883
# ------------------------------------------
listener 1883
protocol mqtt
password_file /etc/mosquitto/passwd

# ------------------------------------------
# Listener 2: MQTT over WebSockets on port 9001
# ------------------------------------------
listener 9001
protocol websockets
password_file /etc/mosquitto/passwd
